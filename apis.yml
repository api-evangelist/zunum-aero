aid: zunum-aero
name: Zunum Aero
description: >-
  Zunum Aero is an American aerospace company founded in 2013 and based in the Seattle
  area (Kirkland / Bothell, Washington) that set out to build hybrid-to-electric regional
  aircraft. Its ZA10 program targeted a six-to-twelve-seat hybrid-electric airplane with a
  700-nautical-mile range, aimed at reviving short-haul point-to-point air travel from
  secondary airports, and it was backed by Boeing HorizonX and JetBlue Technology Ventures.
  The company laid off nearly all of its staff in late 2018 and paused operations, and it
  later pursued trade-secret litigation against Boeing. Zunum Aero is an aircraft
  manufacturer, not a software vendor: its public web presence is a marketing and press
  site with no developer program, no developer portal, no documentation, and no published
  machine-readable API contract of any kind.
